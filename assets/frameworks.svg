<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="Four ethical frameworks, highlighted in turn">
<title>Four ethical frameworks</title>
<style>.ov{opacity:0;animation:slot 12s infinite}@keyframes slot{0%{opacity:0;transform:translateY(0)}3%{opacity:1;transform:translateY(-6px)}22%{opacity:1;transform:translateY(-6px)}25%{opacity:0;transform:translateY(0)}100%{opacity:0}}</style>
<rect width="1200" height="330" fill="#f1ebdd"/>
<text x="40" y="40" font-family="'JetBrains Mono',ui-monospace,'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="16" font-weight="700" letter-spacing="2" fill="#b5391f">FOUR LENSES, ONE DECISION</text>
<g><rect x="44" y="64" width="270" height="230" fill="#1d1c18" opacity=".12"/>
<rect x="40" y="60" width="270" height="230" rx="4" fill="#f8f4ea" stroke="#1d1c18" stroke-width="2"/>
<rect x="40" y="60" width="270" height="10" fill="#b5391f"/>
<text x="60" y="92" font-family="'JetBrains Mono',ui-monospace,'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" font-weight="700" letter-spacing="2" fill="#b5391f">DUTY</text><text x="60" y="132" font-family="Georgia,'DejaVu Serif','Times New Roman',serif" font-size="27" font-weight="700" fill="#1d1c18">Deontology</text><text x="60" y="168" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'DejaVu Sans',Arial,sans-serif" font-size="17" fill="#6a6455">What is my</text><text x="60" y="192" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'DejaVu Sans',Arial,sans-serif" font-size="17" fill="#6a6455">absolute duty?</text><text x="60" y="232" font-family="'JetBrains Mono',ui-monospace,'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#6a6455">Never use data</text><text x="60" y="254" font-family="'JetBrains Mono',ui-monospace,'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#6a6455">without consent.</text>
<g class="ov" style="animation-delay:0s"><rect x="40" y="60" width="270" height="230" rx="4" fill="#1d1c18"/><rect x="40" y="60" width="270" height="10" fill="#b5391f"/>
<text x="60" y="92" font-family="'JetBrains Mono',ui-monospace,'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" font-weight="700" letter-spacing="2" fill="#f0b43a">DUTY</text><text x="60" y="132" font-family="Georgia,'DejaVu Serif','Times New Roman',serif" font-size="27" font-weight="700" fill="#f1ebdd">Deontology</text><text x="60" y="168" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'DejaVu Sans',Arial,sans-serif" font-size="17" fill="#d6cfbb">What is my</text><text x="60" y="192" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'DejaVu Sans',Arial,sans-serif" font-size="17" fill="#d6cfbb">absolute duty?</text><text x="60" y="232" font-family="'JetBrains Mono',ui-monospace,'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#d6cfbb">Never use data</text><text x="60" y="254" font-family="'JetBrains Mono',ui-monospace,'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#d6cfbb">without consent.</text></g></g>
<g><rect x="334" y="64" width="270" height="230" fill="#1d1c18" opacity=".12"/>
<rect x="330" y="60" width="270" height="230" rx="4" fill="#f8f4ea" stroke="#1d1c18" stroke-width="2"/>
<rect x="330" y="60" width="270" height="10" fill="#1b6560"/>
<text x="350" y="92" font-family="'JetBrains Mono',ui-monospace,'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" font-weight="700" letter-spacing="2" fill="#1b6560">OUTCOME</text><text x="350" y="132" font-family="Georgia,'DejaVu Serif','Times New Roman',serif" font-size="27" font-weight="700" fill="#1d1c18">Utilitarianism</text><text x="350" y="168" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'DejaVu Sans',Arial,sans-serif" font-size="17" fill="#6a6455">What does the most</text><text x="350" y="192" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'DejaVu Sans',Arial,sans-serif" font-size="17" fill="#6a6455">good for most people?</text><text x="350" y="232" font-family="'JetBrains Mono',ui-monospace,'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#6a6455">Weigh benefit</text><text x="350" y="254" font-family="'JetBrains Mono',ui-monospace,'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#6a6455">against harm.</text>
<g class="ov" style="animation-delay:3s"><rect x="330" y="60" width="270" height="230" rx="4" fill="#1d1c18"/><rect x="330" y="60" width="270" height="10" fill="#1b6560"/>
<text x="350" y="92" font-family="'JetBrains Mono',ui-monospace,'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" font-weight="700" letter-spacing="2" fill="#f0b43a">OUTCOME</text><text x="350" y="132" font-family="Georgia,'DejaVu Serif','Times New Roman',serif" font-size="27" font-weight="700" fill="#f1ebdd">Utilitarianism</text><text x="350" y="168" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'DejaVu Sans',Arial,sans-serif" font-size="17" fill="#d6cfbb">What does the most</text><text x="350" y="192" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'DejaVu Sans',Arial,sans-serif" font-size="17" fill="#d6cfbb">good for most people?</text><text x="350" y="232" font-family="'JetBrains Mono',ui-monospace,'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#d6cfbb">Weigh benefit</text><text x="350" y="254" font-family="'JetBrains Mono',ui-monospace,'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#d6cfbb">against harm.</text></g></g>
<g><rect x="624" y="64" width="270" height="230" fill="#1d1c18" opacity=".12"/>
<rect x="620" y="60" width="270" height="230" rx="4" fill="#f8f4ea" stroke="#1d1c18" stroke-width="2"/>
<rect x="620" y="60" width="270" height="10" fill="#8f5f00"/>
<text x="640" y="92" font-family="'JetBrains Mono',ui-monospace,'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" font-weight="700" letter-spacing="2" fill="#8f5f00">CHARACTER</text><text x="640" y="132" font-family="Georgia,'DejaVu Serif','Times New Roman',serif" font-size="27" font-weight="700" fill="#1d1c18">Virtue Ethics</text><text x="640" y="168" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'DejaVu Sans',Arial,sans-serif" font-size="17" fill="#6a6455">What would an</text><text x="640" y="192" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'DejaVu Sans',Arial,sans-serif" font-size="17" fill="#6a6455">excellent engineer do?</text><text x="640" y="232" font-family="'JetBrains Mono',ui-monospace,'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#6a6455">Own your mistakes,</text><text x="640" y="254" font-family="'JetBrains Mono',ui-monospace,'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#6a6455">admit your flaws.</text>
<g class="ov" style="animation-delay:6s"><rect x="620" y="60" width="270" height="230" rx="4" fill="#1d1c18"/><rect x="620" y="60" width="270" height="10" fill="#8f5f00"/>
<text x="640" y="92" font-family="'JetBrains Mono',ui-monospace,'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" font-weight="700" letter-spacing="2" fill="#f0b43a">CHARACTER</text><text x="640" y="132" font-family="Georgia,'DejaVu Serif','Times New Roman',serif" font-size="27" font-weight="700" fill="#f1ebdd">Virtue Ethics</text><text x="640" y="168" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'DejaVu Sans',Arial,sans-serif" font-size="17" fill="#d6cfbb">What would an</text><text x="640" y="192" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'DejaVu Sans',Arial,sans-serif" font-size="17" fill="#d6cfbb">excellent engineer do?</text><text x="640" y="232" font-family="'JetBrains Mono',ui-monospace,'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#d6cfbb">Own your mistakes,</text><text x="640" y="254" font-family="'JetBrains Mono',ui-monospace,'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#d6cfbb">admit your flaws.</text></g></g>
<g><rect x="914" y="64" width="270" height="230" fill="#1d1c18" opacity=".12"/>
<rect x="910" y="60" width="270" height="230" rx="4" fill="#f8f4ea" stroke="#1d1c18" stroke-width="2"/>
<rect x="910" y="60" width="270" height="10" fill="#3b6b2a"/>
<text x="930" y="92" font-family="'JetBrains Mono',ui-monospace,'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" font-weight="700" letter-spacing="2" fill="#3b6b2a">RIGHTS</text><text x="930" y="132" font-family="Georgia,'DejaVu Serif','Times New Roman',serif" font-size="27" font-weight="700" fill="#1d1c18">Rights-Based</text><text x="930" y="168" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'DejaVu Sans',Arial,sans-serif" font-size="17" fill="#6a6455">Whose rights are</text><text x="930" y="192" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'DejaVu Sans',Arial,sans-serif" font-size="17" fill="#6a6455">at stake?</text><text x="930" y="232" font-family="'JetBrains Mono',ui-monospace,'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#6a6455">Privacy is not</text><text x="930" y="254" font-family="'JetBrains Mono',ui-monospace,'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#6a6455">a trade-off.</text>
<g class="ov" style="animation-delay:9s"><rect x="910" y="60" width="270" height="230" rx="4" fill="#1d1c18"/><rect x="910" y="60" width="270" height="10" fill="#3b6b2a"/>
<text x="930" y="92" font-family="'JetBrains Mono',ui-monospace,'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" font-weight="700" letter-spacing="2" fill="#f0b43a">RIGHTS</text><text x="930" y="132" font-family="Georgia,'DejaVu Serif','Times New Roman',serif" font-size="27" font-weight="700" fill="#f1ebdd">Rights-Based</text><text x="930" y="168" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'DejaVu Sans',Arial,sans-serif" font-size="17" fill="#d6cfbb">Whose rights are</text><text x="930" y="192" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'DejaVu Sans',Arial,sans-serif" font-size="17" fill="#d6cfbb">at stake?</text><text x="930" y="232" font-family="'JetBrains Mono',ui-monospace,'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#d6cfbb">Privacy is not</text><text x="930" y="254" font-family="'JetBrains Mono',ui-monospace,'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#d6cfbb">a trade-off.</text></g></g>

