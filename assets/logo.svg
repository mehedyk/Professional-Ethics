<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="240" height="240" role="img" aria-label="SE 441 Ethics logo: a balance scale settling level">
  <title>SE 441 Ethics</title>
  <style>.lg-beam{transform-origin:60px 35px;animation:lgTilt 6s ease-in-out infinite}
.lg-pan{animation:lgUn 6s ease-in-out infinite}
@keyframes lgTilt{0%{transform:rotate(-13deg)}12%{transform:rotate(9deg)}24%{transform:rotate(-5deg)}34%{transform:rotate(3deg)}44%{transform:rotate(-1.4deg)}52%,86%{transform:rotate(0)}100%{transform:rotate(-13deg)}}
@keyframes lgUn{0%{transform:rotate(13deg)}12%{transform:rotate(-9deg)}24%{transform:rotate(5deg)}34%{transform:rotate(-3deg)}44%{transform:rotate(1.4deg)}52%,86%{transform:rotate(0)}100%{transform:rotate(13deg)}}</style>
  <rect width="120" height="120" rx="26" fill="#1d1c18"/>
  <rect x="57" y="35" width="6" height="55" fill="#f1ebdd"/>
  <rect x="34" y="88" width="52" height="7" rx="3.5" fill="#f1ebdd"/>
  <g class="lg-beam">
    <rect x="16" y="32" width="88" height="6" rx="3" fill="#f1ebdd"/>
    <g class="lg-pan" style="transform-origin:24px 38px">
      <path d="M24 38 L12 64 M24 38 L36 64" stroke="#f1ebdd" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <path d="M9 64 H39 A15 11 0 0 1 9 64 Z" fill="#f1ebdd"/>
      <rect x="18" y="52" width="12" height="12" rx="1.5" fill="#e8603f"/>
    </g>
    <g class="lg-pan" style="transform-origin:96px 38px">
      <path d="M96 38 L84 64 M96 38 L108 64" stroke="#f1ebdd" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <path d="M81 64 H111 A15 11 0 0 1 81 64 Z" fill="#f1ebdd"/>
      <circle cx="96" cy="57" r="7" fill="#4cb5aa"/>
    </g>
  </g>
  <circle cx="60" cy="35" r="4.5" fill="#e0a526"/>
</svg>
