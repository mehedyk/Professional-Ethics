  <g class="lg-beam">
    <rect x="16" y="32" width="88" height="6" rx="3" fill="#f1ebdd"/>
    <g class="lg-pan" style="transform-origin:24px 38px">
      <path d="M24 38 L12 64 M24 38 L36 64" stroke="#f1ebdd" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <path d="M9 64 H39 A15 11 0 0 1 9 64 Z" fill="#f1ebdd"/>
