      <path d="M81 64 H111 A15 11 0 0 1 81 64 Z" fill="#f1ebdd"/>
      <circle cx="96" cy="57" r="7" fill="#4cb5aa"/>
    </g>
  </g>
  <circle cx="60" cy="35" r="4.5" fill="#e0a526"/></g>
<text x="330" y="102" font-family="'JetBrains Mono',ui-monospace,'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="20" font-weight="700" letter-spacing="2" fill="#b5391f">SE 441  ·  FALL 2026</text>
<g clip-path="url(#tc)"><text x="330" y="190" font-family="Georgia,'DejaVu Serif','Times New Roman',serif" font-size="64" font-weight="700" fill="#1d1c18" textLength="720" lengthAdjust="spacingAndGlyphs">Professional Ethics</text></g>
<rect y="128" width="6" height="74" fill="#b5391f"><animate attributeName="x" values="326;1050;1050;326" keyTimes="0;.38;.9;1" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0;1;0;1" dur="1s" repeatCount="indefinite"/></rect>
<rect x="330" y="212" height="5" fill="#b5391f" width="0"><animate attributeName="width" values="0;140;140;0" keyTimes="0;.45;.9;1" dur="9s" repeatCount="indefinite"/></rect>
