<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="SE 441 Professional Ethics: animated banner">
<title>SE 441 Professional Ethics</title>
<style>.lg-beam{transform-origin:60px 35px;animation:lgTilt 6s ease-in-out infinite}
.lg-pan{animation:lgUn 6s ease-in-out infinite}
@keyframes lgTilt{0%{transform:rotate(-13deg)}12%{transform:rotate(9deg)}24%{transform:rotate(-5deg)}34%{transform:rotate(3deg)}44%{transform:rotate(-1.4deg)}52%,86%{transform:rotate(0)}100%{transform:rotate(-13deg)}}
@keyframes lgUn{0%{transform:rotate(13deg)}12%{transform:rotate(-9deg)}24%{transform:rotate(5deg)}34%{transform:rotate(-3deg)}44%{transform:rotate(1.4deg)}52%,86%{transform:rotate(0)}100%{transform:rotate(13deg)}}
.stamp{transform-origin:1110px 84px;animation:spin 18s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sub{opacity:0;animation:subin 9s ease infinite}
@keyframes subin{0%,30%{opacity:0;transform:translateY(8px)}42%,88%{opacity:1;transform:none}96%,100%{opacity:0}}
</style>
<defs>
<pattern id="rule" width="20" height="36" patternUnits="userSpaceOnUse"><rect y="35" width="20" height="1" fill="#1d1c18" opacity=".10"/></pattern>
<clipPath id="tc"><rect x="326" y="120" height="90" width="0"><animate attributeName="width" values="0;730;730;0" keyTimes="0;.38;.9;1" dur="9s" repeatCount="indefinite"/></rect></clipPath>
</defs>
<rect width="1200" height="300" fill="#f1ebdd"/>
<rect width="1200" height="300" fill="url(#rule)"/>
<rect x="44" width="2" height="300" fill="#b5391f" opacity=".45"/>
