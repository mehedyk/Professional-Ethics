<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="1200" height="450" role="img" aria-label="Case study flow: discovery, misuse, pressure, then two options">
<title>Nusrat's decision flow</title>
<style>.fl{fill:none;stroke:#1d1c18;stroke-width:3;stroke-dasharray:9 7;animation:dash 1.1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-16}}
.pa{animation:pa 10s ease infinite}.pb{animation:pb 10s ease infinite}
@keyframes pa{0%,40%{opacity:.55}50%,80%{opacity:1}100%{opacity:.55}}
@keyframes pb{0%,40%{opacity:.55}50%,80%{opacity:1}100%{opacity:.55}}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d1c18"/></marker></defs>
<rect width="1200" height="450" fill="#f1ebdd"/>
<text x="50" y="30" font-family="'JetBrains Mono',ui-monospace,'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="16" font-weight="700" letter-spacing="2" fill="#b5391f">CASE STUDY FLOW</text>
<path class="fl" d="M312 110 H366" marker-end="url(#ah)"/>
<path class="fl" d="M632 110 H686" marker-end="url(#ah)"/>
<path class="fl" d="M820 172 V228" marker-end="url(#ah)"/>
<path class="fl" d="M780 270 H405 V296" marker-end="url(#ah)" stroke="#b5391f"/>
<path class="fl" d="M860 270 H870 V296" marker-end="url(#ah)" stroke="#3b6b2a"/>
<g><rect x="760" y="230" width="120" height="40" rx="20" fill="#1d1c18"/><text x="820" y="256" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#f1ebdd">DECIDE</text></g>
<g ><rect x="54" y="54" width="260" height="120" fill="#1d1c18" opacity=".12"/><rect x="50" y="50" width="260" height="120" rx="4" fill="#f8f4ea" stroke="#1d1c18" stroke-width="2"/><rect x="50" y="50" width="8" height="120" fill="#8f5f00"/><text x="74" y="76" font-family="'JetBrains Mono',ui-monospace,'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="13" font-weight="700" letter-spacing="2" fill="#8f5f00">01 · DISCOVER</text><text x="74" y="102" font-family="Georgia,'DejaVu Serif','Times New Roman',serif" font-size="21" font-weight="700" fill="#1d1c18">Real data in test</text><text x="74" y="126" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'DejaVu Sans',Arial,sans-serif" font-size="16" fill="#6a6455">Nusrat finds students'</text><text x="74" y="147" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'DejaVu Sans',Arial,sans-serif" font-size="16" fill="#6a6455">records in the test setup.</text></g><g ><rect x="374" y="54" width="260" height="120" fill="#1d1c18" opacity=".12"/><rect x="370" y="50" width="260" height="120" rx="4" fill="#f8f4ea" stroke="#1d1c18" stroke-width="2"/><rect x="370" y="50" width="8" height="120" fill="#b5391f"/><text x="394" y="76" font-family="'JetBrains Mono',ui-monospace,'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="13" font-weight="700" letter-spacing="2" fill="#b5391f">02 · MISUSE</text><text x="394" y="102" font-family="Georgia,'DejaVu Serif','Times New Roman',serif" font-size="21" font-weight="700" fill="#1d1c18">No consent given</text><text x="394" y="126" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'DejaVu Sans',Arial,sans-serif" font-size="16" fill="#6a6455">Names, emails, records and</text><text x="394" y="147" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'DejaVu Sans',Arial,sans-serif" font-size="16" fill="#6a6455">logins used without asking.</text></g><g ><rect x="694" y="54" width="260" height="120" fill="#1d1c18" opacity=".12"/><rect x="690" y="50" width="260" height="120" rx="4" fill="#f8f4ea" stroke="#1d1c18" stroke-width="2"/><rect x="690" y="50" width="8" height="120" fill="#1b6560"/><text x="714" y="76" font-family="'JetBrains Mono',ui-monospace,'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="13" font-weight="700" letter-spacing="2" fill="#1b6560">03 · PRESSURE</text><text x="714" y="102" font-family="Georgia,'DejaVu Serif','Times New Roman',serif" font-size="21" font-weight="700" fill="#1d1c18">"Don't raise it"</text><text x="714" y="126" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'DejaVu Sans',Arial,sans-serif" font-size="16" fill="#6a6455">The manager worries about</text><text x="714" y="147" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'DejaVu Sans',Arial,sans-serif" font-size="16" fill="#6a6455">delaying the release.</text></g><g class="pa"><rect x="244" y="304" width="330" height="120" fill="#1d1c18" opacity=".12"/><rect x="240" y="300" width="330" height="120" rx="4" fill="#f3e0d9" stroke="#1d1c18" stroke-width="2"/><rect x="240" y="300" width="8" height="120" fill="#b5391f"/><text x="264" y="326" font-family="'JetBrains Mono',ui-monospace,'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="13" font-weight="700" letter-spacing="2" fill="#b5391f">OPTION A</text><text x="264" y="352" font-family="Georgia,'DejaVu Serif','Times New Roman',serif" font-size="21" font-weight="700" fill="#1d1c18">Stay silent</text><text x="264" y="376" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'DejaVu Sans',Arial,sans-serif" font-size="16" fill="#6a6455">Breach of privacy continues;</text><text x="264" y="397" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'DejaVu Sans',Arial,sans-serif" font-size="16" fill="#6a6455">leaked data is permanent.</text></g><g class="pb"><rect x="694" y="304" width="360" height="120" fill="#1d1c18" opacity=".12"/><rect x="690" y="300" width="360" height="120" rx="4" fill="#e0ead3" stroke="#1d1c18" stroke-width="2"/><rect x="690" y="300" width="8" height="120" fill="#3b6b2a"/><text x="714" y="326" font-family="'JetBrains Mono',ui-monospace,'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="13" font-weight="700" letter-spacing="2" fill="#3b6b2a">OPTION B</text><text x="714" y="352" font-family="Georgia,'DejaVu Serif','Times New Roman',serif" font-size="21" font-weight="700" fill="#1d1c18">Report and fix</text><text x="714" y="376" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'DejaVu Sans',Arial,sans-serif" font-size="16" fill="#6a6455">Anonymise the data or get consent;</text><text x="714" y="397" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'DejaVu Sans',Arial,sans-serif" font-size="16" fill="#6a6455">accept a short delay.</text></g>
<circle r="9" fill="#b5391f" stroke="#1d1c18" stroke-width="2"><animateMotion dur="10s" repeatCount="indefinite" path="M100 110 H370 H686 H820 V230" keyPoints="0;0;1;1" keyTimes="0;.02;.4;1" calcMode="linear"/><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.4;.41;1" dur="10s" repeatCount="indefinite"/></circle>
<circle r="8" fill="#b5391f" stroke="#1d1c18" stroke-width="2"><animateMotion dur="10s" repeatCount="indefinite" path="M780 270 H405 V300" keyPoints="0;0;1;1" keyTimes="0;.42;.55;1" calcMode="linear"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.42;.43;.55;.56;1" dur="10s" repeatCount="indefinite"/></circle>
<circle r="8" fill="#3b6b2a" stroke="#1d1c18" stroke-width="2"><animateMotion dur="10s" repeatCount="indefinite" path="M860 270 H870 V300" keyPoints="0;0;1;1" keyTimes="0;.42;.55;1" calcMode="linear"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.42;.43;.55;.56;1" dur="10s" repeatCount="indefinite"/></circle>
</svg>
